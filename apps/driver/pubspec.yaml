name: ridema_driver
description: "RideMA Driver: receive ride requests in Meknes, accept the rider's price or counter-offer. Cash only, 0% commission."
publish_to: 'none'

# versionName+versionCode. Bump both for every release (APK download page and stores).
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  ridema_core:
    path: ../../packages/ridema_core
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_picker: ^13.3.0
  flutter_foreground_task: ^11.0.3
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  permission_handler: ^13.0.2
  provider: ^6.1.5+1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
