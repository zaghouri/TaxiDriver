name: ridema_rider
description: "RideMA rider app: request a ride in Meknes, offer your fare, choose a driver, pay cash."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  ridema_core:
    path: ../../packages/ridema_core
  provider: ^6.1.5+1
  google_maps_flutter: ^2.19.0
  flutter_contacts: ^2.6.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.1.2

flutter:

  uses-material-design: true

