name: ridema_core
description: "Shared code for the RideMA rider and driver apps: brand, theme, localisation, API client, realtime, auth, shared screens and safety widgets."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_webrtc: ^1.6.3
  geolocator: ^14.1.2
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  assets:
    - assets/brand/
